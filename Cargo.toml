[package]
name = "roundtable"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A terminal console where Claude Code, Codex and free models sit at one table"
repository = "https://github.com/NobodyOne04/roundtable"
publish = false

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = "0.3"
ratatui = "0.30"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = "1"
